<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ItzNotHj Portfolio</title>

<style>
/* RESET */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

/* BODY */
body {
    height: 100vh;
    overflow: hidden;
    background: #d4d4d4;
    font-family: "Inter", "Segoe UI", sans-serif;
}

/* APP */
.app {
    height: 100%;
    width: 100%;
    padding: 18px;
    position: relative;
}

/* TOP BAR */
.topbar {
    height: 64px;
    width: 100%;
    padding: 6px;

    background: rgba(255,255,255,0.55);
    backdrop-filter: blur(10px);
    border-radius: 16px;

    display: flex;
    justify-content: space-between;
    align-items: center;

    box-shadow: 0 2px 6px rgba(0,0,0,0.05);
}

/* LEFT TEXT */
.topbar-left {
    padding-left: 14px;
    display: flex;
    flex-direction: column;
    justify-content: center;
}

.title {
    font-size: 19px;
    font-weight: 500;
    color: #111;
}

.subtitle {
    font-size: 12px;
    color: #666;
}

/* RIGHT SEGMENT (SPLIT AREA) */
.topbar-controls {
    display: flex;
    align-items: center;
    gap: 10px;

    padding: 6px 8px;
    border-radius: 12px;

    background: rgba(255,255,255,0.7);
    backdrop-filter: blur(12px);

    box-shadow: inset 0 0 0 1px rgba(0,0,0,0.04);
}

/* ICON BUTTONS */
.icon-btn {
    width: 32px;
    height: 32px;
    border-radius: 50%;

    background: rgba(255,255,255,0.9);

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 14px;
    color: #111;
}

/* PROFILE */
.profile {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    background: #000;
}

/* MAIN */
.main {
    position: absolute;
    inset: 0;
}

/* LEFT PANEL */
.left {
    position: absolute;
    left: 28px;
    bottom: 38px;

    display: flex;
    flex-direction: column;
    gap: 14px;
}

/* SEARCH */
.search {
    width: 220px;
    padding: 12px 14px;

    background: rgba(255,255,255,0.55);
    backdrop-filter: blur(8px);

    border-radius: 14px;

    font-size: 13px;
    line-height: 1.4;
}

/* MENU */
.menu {
    display: flex;
    flex-direction: column;
    gap: 10px;
}

.menu-item {
    width: 220px;
    padding: 12px 14px;

    background: rgba(255,255,255,0.55);
    backdrop-filter: blur(8px);

    border-radius: 12px;

    display: flex;
    justify-content: space-between;
    align-items: center;

    font-size: 13px;
}

/* RIGHT CARD */
.card {
    position: absolute;
    right: 70px;
    bottom: 60px;

    width: 270px;
    padding: 22px;

    background: rgba(255,255,255,0.6);
    backdrop-filter: blur(12px);

    border-radius: 18px;

    box-shadow: 0 2px 6px rgba(0,0,0,0.05);
}

/* RED DOT */
.card-dot {
    position: absolute;
    top: 10px;
    left: 10px;

    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #ff3b3b;
}

/* LOGO */
.card-logo {
    text-align: right;
    font-weight: 600;
    letter-spacing: 2px;
    margin-bottom: 6px;
}

/* TITLE */
.card h2 {
    font-family: "Times New Roman", serif;
    font-size: 22px;
    font-weight: 500;
    margin-bottom: 10px;
}

/* TEXT */
.card p {
    font-size: 12px;
    line-height: 1.4;
    color: #222;
}
</style>
</head>

<body>

<div class="app">

    <!-- TOP BAR -->
    <div class="topbar">
        <div class="topbar-left">
            <div class="title">ItzNotHj</div>
            <div class="subtitle">Official Portfolio</div>
        </div>

        <div class="topbar-controls">
            <div class="icon-btn">✓</div>
            <div class="icon-btn">+</div>
            <div class="icon-btn">⋯</div>
            <div class="profile"></div>
        </div>
    </div>

    <!-- MAIN -->
    <div class="main">

        <!-- LEFT -->
        <div class="left">
            <div class="search">
                🔍 UI & UX Designer<br>
                Graphic Designer
            </div>

            <div class="menu">
                <div class="menu-item">
                    <span>Essential Widgets</span>
                    <span>✳</span>
                </div>

                <div class="menu-item">
                    <span>Side Dock</span>
                    <span>🔊</span>
                </div>

                <div class="menu-item">
                    <span>Glyph Receiver</span>
                    <span>🎮</span>
                </div>
            </div>
        </div>

        <!-- RIGHT CARD -->
        <div class="card">
            <div class="card-dot"></div>
            <div class="card-logo">RO</div>

            <h2>About and More</h2>
            <p>
                Im a graphic designer and I have been working on the Nothing
                Community’s apps and amazing creations. I have 5 years of
                experience in design.
            </p>
        </div>

    </div>

</div>

</body>
</html>
